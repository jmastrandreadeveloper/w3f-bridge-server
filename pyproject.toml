[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "w3f-bridge-server"
version = "1.0.0"
description = "W3F Bridge Server — Python framework for building W3F Platform backends"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["src/w3f_bridge"]
